# Weekly dependency update pull requests. CI must pass before any of them is merged.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR for all dev tools (ruff, mypy, pytest, ...) instead of one each.
      dev-tools:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
