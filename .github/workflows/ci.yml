# Continuous integration: every push and pull request must pass `make check`.
# The Ubuntu job is the gate described in the architecture doc (a fresh Linux VM runs
# `uv sync && make check` green). The Windows job keeps scripts/check.ps1 working for local dev.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run on the same branch when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-linux:
    name: make check (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python and locked dependencies
        run: uv sync --locked

      - name: Lint, type-check and test
        run: make check

  check-windows:
    name: check.ps1 (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python and locked dependencies
        run: uv sync --locked

      - name: Lint, type-check and test
        shell: pwsh
        run: ./scripts/check.ps1
